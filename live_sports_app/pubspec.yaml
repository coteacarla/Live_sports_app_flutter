name: live_sports_tracker
description: A comprehensive multi-sport live tracking application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────────────
  flutter_riverpod: ^3.2.1
  hooks_riverpod: ^3.2.1           # Optional: useRef / useState in widgets
  riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  flutter_hooks: ^0.21.0

  # ── Networking ────────────────────────────────────────────────────────────
  dio: ^5.4.3
  connectivity_plus: ^6.0.3        # Detect network availability

  # ── Local storage ─────────────────────────────────────────────────────────
  hive_flutter: ^1.1.0             # For simple key-value (follows, prefs)
  isar: ^3.1.0                     # For structured local match cache
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.3

  # ── Notifications ─────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.1.2
  firebase_core: ^2.30.1
  firebase_messaging: ^14.9.1

  # ── Utils ─────────────────────────────────────────────────────────────────
  equatable: ^2.0.5                # Value equality for entities
  intl: ^0.19.0                    # Date/time formatting
  logger: ^2.3.0                   # Structured logging
  cached_network_image: ^3.3.1     # Team/league logo caching
  uuid: ^4.0.0                     # UUID generation
  timezone: ^0.9.4                 # Timezone utilities for notifications
  freezed_annotation: ^3.1.0        # For immutable state classes
  json_annotation: ^4.9.0           # For JSON serialization annotations
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^4.0.3       # Code-gen for @riverpod annotations
  freezed: ^3.2.5                  # Code-gen for immutable classes
  json_serializable: ^6.8.0        # Code-gen for JSON serialization
  mocktail: ^1.0.3                 # Mocking for unit tests
  very_good_analysis: ^5.1.0       # Strict lint rules

flutter:
  uses-material-design: true